name: Deploy

# Pipeline único: os testes rodam uma vez e são o gate dos dois deploys.
# O trigger do Cloud Build precisa ficar DESABILITADO no console GCP, senão o
# push na main dispara o deploy do backend por fora deste gate.
# Roda em PR também (só o job test) para o check obrigatório de branch
# protection ter status a reportar; deploy-backend/deploy-frontend só rodam
# em push na main (github.event_name == 'push'), nunca numa PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: jogo-do-ano-app
  GCP_REGION: southamerica-east1
  CLOUD_RUN_SERVICE: jogo-do-ano
  IMAGE_REPO: southamerica-east1-docker.pkg.dev/jogo-do-ano-app/cloud-run-source-deploy/jogo-do-ano

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  # Backend primeiro: o front tem o host do backend hardcoded em
  # public/js/config.js e consome /api/* dele, então subir o front antes
  # arriscaria chamar uma API que ainda não existe.
  deploy-backend:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # necessário para o Workload Identity Federation
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Taggeia com o SHA do commit (além de latest) para dar rollback por
      # imagem: gcloud run deploy --image ...:<sha antigo>
      - run: |
          docker build \
            -t ${{ env.IMAGE_REPO }}:${{ github.sha }} \
            -t ${{ env.IMAGE_REPO }}:latest \
            .

      - run: docker push ${{ env.IMAGE_REPO }} --all-tags

      - run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image=${{ env.IMAGE_REPO }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=1 \
            --timeout=3600 \
            --port=3000 \
            --quiet

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

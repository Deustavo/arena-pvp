<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova senha - Arena PVP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="standalone-page">
  <div class="standalone-card">
    <h1>Arena PVP</h1>
    <h2>Criar nova senha</h2>
    <form id="resetForm" novalidate>
      <div class="auth-field">
        <label for="resetPassword">Nova senha</label>
        <input type="password" id="resetPassword" autocomplete="new-password" placeholder="Mínimo de 8 caracteres">
      </div>
      <div class="auth-field">
        <label for="resetPasswordConfirm">Confirme a nova senha</label>
        <input type="password" id="resetPasswordConfirm" autocomplete="new-password" placeholder="Digite de novo">
      </div>
      <div id="resetFeedback"></div>
      <button type="submit" id="btnResetSubmit">Salvar nova senha</button>
    </form>
    <a href="/" id="resetBackLink">Voltar para o jogo</a>
  </div>
  <script type="module" src="js/resetPassword.js"></script>
</body>
</html>

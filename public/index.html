<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo do Ano - 1x1</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="menu">
    <div id="menuBody">
      <div id="menuLeft">
        <h1>Jogo do Ano</h1>
        <button id="btnOnline">Jogar Online</button>
        <button id="btnBot">Jogar contra Bot</button>
        <hr id="menuDivider">
        <button id="btnHowToPlay">Como jogar</button>
        <div id="onlineCount">● <span id="onlineCountValue">--</span> jogador(es) online</div>
      </div>
      <div id="menuRight">
        <div id="nicknameField">
          <label id="nicknameLabel" for="nicknameInput">Jogador</label>
          <input type="text" id="nicknameInput" placeholder="Seu nickname" maxlength="20" autocomplete="off">
          <div id="nicknameError">Digite um nickname para jogar</div>
        </div>
        <div id="classPanel">
          <h2 id="classPanelTitle">Classe</h2>
          <div id="classArea">
            <div id="classList"></div>
            <div id="classDetails"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="howToPlayOverlay">
    <div class="modal">
      <div id="tutHeader">
        <h2>Como jogar</h2>
        <div id="tutHeaderRight">
          <span id="tutStepCount"></span>
          <button id="btnTutClose" type="button" title="Fechar (Esc)" aria-label="Fechar">✕</button>
        </div>
      </div>
      <canvas id="tutCanvas" width="340" height="190"></canvas>
      <h3 id="tutTitle"></h3>
      <p id="tutText"></p>
      <div id="tutDots"></div>
      <div id="tutNav">
        <button id="btnTutPrev">Voltar</button>
        <button id="btnTutNext">Próximo</button>
      </div>
    </div>
  </div>

  <div id="game-wrap">
    <div id="hud">
      <div class="hud-row">
        <div class="hud-name-row">
          <div class="hud-class-icon" id="classIconP0"></div>
          <div class="hud-name" id="nameP0">Você</div>
        </div>
        <div class="hearts" id="livesP0"></div>
        <div class="cooldown-bar"><div class="cooldown-fill" id="cooldownP0"></div></div>
      </div>
      <div class="hud-row">
        <div class="hud-name-row">
          <div class="hud-class-icon" id="classIconP1"></div>
          <div class="hud-name" id="nameP1">Oponente</div>
        </div>
        <div class="hearts" id="livesP1"></div>
        <div class="cooldown-bar"><div class="cooldown-fill" id="cooldownP1"></div></div>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="gameOverOverlay">
        <h2 id="gameOverMessage"></h2>
        <div class="overlay-buttons">
          <button id="btnPlayAgain">Jogar novamente</button>
          <button id="btnBackToMenu">Menu inicial</button>
        </div>
      </div>
      <div id="waitingOverlay">
        <h2 id="waitingMessage">Aguardando oponente...</h2>
        <div class="overlay-buttons">
          <button id="btnLeaveQueue">Sair da fila</button>
        </div>
      </div>
      <div id="countdownOverlay">
        <h2>Partida encontrada!</h2>
        <div id="countdownNumber"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

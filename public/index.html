<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo do Ano - 1x1</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1d1d2b;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: sans-serif;
    color: #eee;
  }
  #menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #menu h1 {
    margin: 0 0 8px 0;
  }
  #menu button {
    font-size: 20px;
    padding: 14px 32px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #457b9d;
    color: #fff;
    min-width: 260px;
  }
  #menu button:hover {
    background: #3a6a89;
  }
  #menu button#btnBot {
    background: #e63946;
  }
  #menu button#btnBot:hover {
    background: #c72f3b;
  }
  #game-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
  }
  #hud {
    margin-bottom: 8px;
    display: flex;
    gap: 40px;
    font-size: 18px;
  }
  .hud-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hearts {
    display: flex;
    gap: 4px;
  }
  .heart {
    position: relative;
    width: 21px;
    height: 18px;
    color: #e63946;
  }
  .heart.lost {
    color: #555;
  }
  .heart-pixel {
    position: absolute;
    width: 3px;
    height: 3px;
    background: currentColor;
  }
  .heart.blink {
    animation: heartBlink 0.4s steps(1, start) 3;
  }
  @keyframes heartBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }
  canvas {
    background: #2b2b3d;
    border: 2px solid #555;
    display: block;
  }
  #canvas-wrap {
    position: relative;
  }
  #gameOverOverlay {
    display: none;
    position: absolute;
    inset: 2px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  #gameOverOverlay h2 {
    margin: 0;
    font-size: 36px;
  }
  #gameOverOverlay.win h2 {
    color: #4ade80;
  }
  #gameOverOverlay.lose h2 {
    color: #e63946;
  }
  #gameOverOverlay .overlay-buttons {
    display: flex;
    gap: 16px;
  }
  #gameOverOverlay button {
    font-size: 16px;
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #457b9d;
    color: #fff;
  }
  #gameOverOverlay button:hover {
    background: #3a6a89;
  }
  #gameOverOverlay button#btnBackToMenu {
    background: #555;
  }
  #gameOverOverlay button#btnBackToMenu:hover {
    background: #444;
  }
  #status {
    margin-top: 8px;
    font-size: 16px;
    min-height: 24px;
  }
  #btnMenu {
    margin-top: 10px;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    background: #555;
    color: #fff;
    display: none;
  }
</style>
</head>
<body>
  <div id="menu">
    <h1>Jogo do Ano</h1>
    <button id="btnOnline">Jogar Online</button>
    <button id="btnBot">Jogar contra Bot</button>
  </div>

  <div id="game-wrap">
    <div id="hud">
      <div class="hud-row">
        <span>Você:</span>
        <div class="hearts" id="livesP0"></div>
      </div>
      <div class="hud-row">
        <span>Oponente:</span>
        <div class="hearts" id="livesP1"></div>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="gameOverOverlay">
        <h2 id="gameOverMessage"></h2>
        <div class="overlay-buttons">
          <button id="btnPlayAgain">Jogar novamente</button>
          <button id="btnBackToMenu">Menu inicial</button>
        </div>
      </div>
    </div>
    <div id="status"></div>
    <button id="btnMenu">Voltar ao Menu</button>
  </div>

  <script src="client.js"></script>
</body>
</html>
